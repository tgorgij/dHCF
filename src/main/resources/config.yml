
settings:
  server-name: "HCF"
  colors:
    primary: AQUA
    secondary: BLUE
    online: GREEN
    offline: GRAY
    deathban: RED
  map:
    number: 1
    start-date: "2026-08-16"
  location-format: "X: %x%, Z: %z%"
  names:
    min: 3
    max: 16
    blocked:
      - VeltPVP
      - MineHQ
      - Arcane

classes:
  archer:
    activation: 0 # Seconds wearing the full leather set before activation.
    effects: # Strength is the displayed potion level; duration is in seconds and refreshes while equipped.
      speed:
        strength: 2
        duration: 5
      resistance:
        strength: 1
        duration: 5
    abilities:
      speed:
        strength: 3
        duration: 5
      jump:
        strength: 4
        duration: 5
    tag:
      damage-multiplier: 1.25

enchantments: # Map kit limits. Use Minecraft enchantment names; omitted or negative values are unrestricted.
  protection: 2
  sharpness: 2

potions: # Brewing limits. Unlisted potions are unrestricted; applies to drinkable, splash, and lingering potions.
  strength:
    enabled: false
  poison:
    extended: false # Disallow redstone's duration extension; regular poison and Poison II are allowed.

koth:
  rewards:
    commands:
      - "economy give %player% 1000" # Run as console; supports %player% and %koth%.

economy:
  default-balance: 500
  currency-symbol: "$"
  minimum-transfer: 1

combat-logger:
  despawn-after: 30 # seconds after spawning or the last uncancelled hit

deathbans: # durations in seconds; shortest matching permission wins
  default-duration: 3600
  permissions:
    - permission: "dhcf.deathban.30minutes"
      duration: 1800
    - permission: "dhcf.deathban.15minutes"
      duration: 900

timers: # seconds
  pvp: 1800
  starting: 3600
  combat: 30
  home: 10
  logout: 30
  stuck: 60
  archertag: 5
  archerSpeed: 30
  archerJump: 30
  apple: 5
  gapple: 3600
  enderpearl: 15

factions:
  player-format: "&9%player%&7[&c%kills%&7]"
  dtr:
    maximum: 6.06
    minimum: -0.99
    freeze-minutes: 30
    regeneration-per-minute: 0.03
    colors:
      raidable: RED
      close-to-raidable: YELLOW
      not-raidable: GREEN
  colors:
    team: GREEN
    ally: BLUE
    enemy: RED
    focus: PINK
    archer-tag: YELLOW
  members:
    max: 10
  claim-wand:
    item: DIAMOND_HOE
    name: "&bClaim Wand"
    lore:
      - "&eLeft click block for position one"
      - "&eRight click block for position two"
      - "&eShift left click air to claim"
      - "&eShift right click air to cancel"
  sizes:
    worlds:
      default:
        warzone-build-limit: 300
        warzone: 750
      nether:
        warzone-build-limit: 80
        warzone: 200
  claim:
    price:
      base: 250
      per-block: 0.25
  home:
    disable-in-end: false
  stuck:
    max-border-distance: 32 # Maximum blocks beyond the original claim to search (1-1024).
    max-search-columns: 8192 # Bound the search when no safe unclaimed destination exists.
