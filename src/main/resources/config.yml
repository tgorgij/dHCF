    enabled: false
  night_vision:
    enabled: false
  invisibility:
    enabled: false

koth:
  rewards:
    commands:
      - "economy give %player% 1000"

economy:
  kill-balance-percentage: 25.0
  default-balance: 500
  currency-symbol: "$"
  minimum-transfer: 1

combat-logger:
  despawn-after: 30

deathbans: # seconds
  default-duration: 3600
  permissions:
    - permission: "dhcf.deathban.30minutes"
      duration: 1800
    - permission: "dhcf.deathban.15minutes"
      duration: 900

timers: # seconds
  rogueSpeed: 30
  rogueJump: 30
  rogueBackstab: 15
  bard: 10
  request: 300
  report: 300
  pvp: 1800
  starting: 3600
  combat: 30
  home: 10
  logout: 30
  stuck: 60
  archertag: 5
  archerSpeed: 30
  archerJump: 30
  apple: 5
  gapple: 3600
  enderpearl: 15

factions:
  points:
    kill: 5
    death: 5
    raidable: 15
    koth: 50
  border:
    material: RED_STAINED_GLASS
  player-format: "&9%player%&7[&c%kills%&7]"
  dtr:
    maximum: 6.06
    minimum: -0.99
    freeze-minutes: 30
    regeneration-per-minute: 0.03
    colors:
      raidable: RED
      close-to-raidable: YELLOW
      not-raidable: GREEN
  colors:
    team: GREEN
    ally: BLUE
    enemy: RED
    focus: PINK
    archer-tag: YELLOW
  members:
    max: 10
  claim-wand:
    item: DIAMOND_HOE
    name: "&bClaim Wand"
    lore:
      - "&eLeft click block for position one"
      - "&eRight click block for position two"
      - "&eShift left click air to claim"
      - "&eShift right click air to cancel"
  sizes:
    worlds:
      default:
        warzone-build-limit: 300
        warzone: 750
      nether:
        warzone-build-limit: 80
        warzone: 200
  claim:
    price:
      base: 250
      per-block: 0.25
  home:
    disable-in-end: false
  stuck:
    max-border-distance: 32
    max-search-columns: 8192

freeze:
  blocked-commands:
    - logout
    - faction
    - spawn
    - home
    - tp
    - tpa
    - tpaccept
    - warp
    - suicide
    - kill

mountains:
  default-interval: 30 # minutes
  default-block: GLOWSTONE
  max-volume: 1000000
  blocks-per-tick: 500

combat:
  blocked-commands:
    - craft
    - f home

conquest:
  koth-equivalent: 5
  default-interval: 30 # seconds
  capture-points: 1
  win-points: 100
  death-penalty: 5
  rewards:
