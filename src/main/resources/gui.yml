settings:
  main:
    title: '&eSettings'
    rows: 3
    items:
      scoreboard-menu:
        material: PAINTING
        name: '&eScoreboard Settings'
        lore:
        - '&7Click to open.'
      messages-menu:
        material: WRITABLE_BOOK
        name: '&eMessage Settings'
        lore:
        - '&7Click to open.'
      public-chat:
        material: PAPER
        name: '&ePublic Chat&7: %state%'
        lore:
        - '&7Click to toggle.'
  scoreboard:
    title: '&eScoreboard Settings'
    rows: 3
    items:
      scoreboard:
        material: PAINTING
        name: '&eScoreboard&7: %state%'
        lore:
        - '&7Click to toggle.'
      ability-cooldowns:
        material: BLAZE_POWDER
        name: '&eAbility Item Cooldowns&7: %state%'
        lore:
        - '&7Show global and item cooldowns.'
        - '&7Click to toggle.'
      request-report-cooldowns:
        material: CLOCK
        name: '&eRequest / Report Cooldowns&7: %state%'
        lore:
        - '&7Show both cooldowns on your scoreboard.'
        - '&7Click to toggle.'
      mountains:
        material: GLOWSTONE
        name: '&eMountain Resets&7: %state%'
        lore:
        - '&7Show mountain reset countdowns on your scoreboard.'
        - '&7Click to toggle.'
      back:
        material: ARROW
        name: '&eBack'
        lore:
        - '&7Click to open.'
  messages:
    title: '&eMessage Settings'
    rows: 3
    items:
      messages:
        material: WRITABLE_BOOK
        name: '&ePrivate Messages&7: %state%'
        lore:
        - '&7Click to toggle.'
      message-sounds:
        material: NOTE_BLOCK
        name: '&eMessage Sounds&7: %state%'
        lore:
        - '&7Click to toggle.'
      back:
        material: ARROW
        name: '&eBack'
        lore:
        - '&7Click to open.'
