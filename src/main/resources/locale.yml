      usage: "&cUsage: /%alias% disband"
      raidable: "&cYou cannot disband your faction while it is raidable."
      success: "&c&lYou have disbanded your faction."
      broadcast: "&c&l%player% has disbanded the faction."
    forcedisband:
      usage: "&cUsage: /%alias% forcedisband <faction>"
      raidable: "&cYou cannot disband a faction while it is raidable."
      success: "&c&lYou have disbanded %faction%."
      broadcast: "&c&l%player% has disbanded the faction."
    invite:
      usage: "&cUsage: /%alias% invite <player>"
      other-faction: "&c%player% already has a faction."
      your-faction: "&c%player% is already in your faction."
      self: "&cYou cannot invite yourself."
      pending: "&cYou have already invited %player%."
