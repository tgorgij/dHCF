    invalid-length: "&cFaction names must be between 3 and 16 characters."
    claim-full: "&cYou cannot claim while your inventory is full."
    captain:
      not: "&cOnly a captain and above can perform this command."
    coleader:
      not: "&cOnly a co-leader and above can perform this command."
    leader:
      not: "&cOnly the leader can perform this command."
    create:
      usage: "&cUsage: /%alias% create <name>"
      already-exists: "&cA faction by this name already exists."
      blocked: "&cYou cannot create a faction by this name."
      invalid-length: "&cFaction names must be between 3 and 16 characters."
      success: "&eYou have created a faction named &b%faction%&e."
      broadcast: "&e%player% has created a faction named &b%faction%&e."
    createsystem:
      usage: "&cUsage: /%alias% createsystem <name>"
      success: "&eYou have created a system faction named &b%faction%&e."
      broadcast: "&e%player% has created a system faction named &b%faction%&e."
    show:
      usage: "&cUsage: /%alias% show <name>"
      none: "&cThere is no player or faction by this name."
      no-faction: "&c%player% is not in a faction."
      teleport-hover: "&eClick to teleport to &b%faction%&e"
    setcolor:
      usage: "&cUsage: /%alias% setcolor <faction> <color>"
      only-system: "&cYou can only set the color of non-player factions."
      success: "&eYou have set the color of &b%faction%&e to %color%this&e."
