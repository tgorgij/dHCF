      usage: "&cUsage: /%alias% sethome"
      cannot: "&cYou must set your factions home in your claim."
      success: "&eYour faction's home has been set."
      broadcast: "&3%player% has set your faction's home."
    map:
      usage: "&cUsage: /%alias% map"
      format: "&eFaction %faction% &eshown by &d%material%&e."
      hidden: "&eClaim pillars have been hidden."
      none: "&cThere are no factions near you."
