      success: "&eYou have set the type of &b%faction%&e to &b%type%&e."
    setlocation:
      usage: "&cUsage: /%alias% setlocation <faction>"
      success: "&eYou have set the location of &b%faction% &eto&b your current location&e."
    debug:
      usage: "&cUsage: /%alias% debug"
      toggle: "&eFaction Debug: %status%"
