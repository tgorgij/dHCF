      usage: "&cUsage: /%alias% uninvite <player>"
      not-invited: "&c%player% is not invited to your faction."
      success: "&eYou have uninvited &b%player% &efrom your faction."
    join:
      usage: "&cUsage: /%alias% join <faction>"
      system: "&cYou cannot join a non-player faction."
      already-in: "&cYou are already in a faction."
      raidable: "&cYou cannot join a faction while it is raidable."
      not-invited: "&cYou have not been invited to this faction."
      max: "&cYou cannot join this faction, as it is full."
      success: "&eYou have joined &b%faction%&e."
      broadcast: "&b%player% &ehas joined your faction."
    open:
      usage: "&cUsage: /%alias% open"
      success: "&eYour faction is now &b%status%&e."
    invites:
      usage: "&cUsage: /%alias% invites"
      none: "&cYou have no pending invites."
      has: "&ePending Invites: &b%invites%"
