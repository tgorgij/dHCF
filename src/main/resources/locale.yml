      raidable: "&cYou cannot leave a faction while it is raidable."
      success: "&eYou have left your faction."
      broadcast: "&b%player% &ehas left the faction."
    deposit:
      usage: "&cUsage: /%alias% deposit <all;amount>"
      success: "&eYou have deposited &b%amount%&e."
      broadcast: "&e%player% has deposited &b%amount%&e."
    rename:
      usage: "&cUsage: /%alias% rename <name>"
      success: "&eYou have renamed your faction to &b%faction%&e."
      broadcast: "&e%player% has renamed your faction to &b%faction%&e."
    claimfor:
      usage: "&cUsage: /%alias% claimfor <player>"
      success: "&eYou are now claiming for &b%faction%&e."
    setdeathban:
      usage: "&cUsage: /%alias% setdeathban <faction>"
      success: "&b%faction%&e Deathban: &b%status%"
    bypass:
      usage: "&cUsage: /%alias% bypass"
      toggle: "&eFaction Bypass: %status%"
    claim:
      usage: "&cUsage: /%alias% claim"
      success: "&eClaim started."
    home:
      usage: "&cUsage: /%alias% home"
      none: "&cYour faction does not have a home."
      end: "&cYou cannot teleport to your faction's home while you're in the end"
      success: "&eTeleporting to your faction's HQ. Please wait &d10 seconds&e..."
