help:
  economy:
    - "&7&m----------------------------------------------------"
    - "%primary%&lEconomy %secondary%Help"
    - "&7&m----------------------------------------------------"
    - "&e/%alias% set <target> <balance> - Set a player's balance"
    - "&e/%alias% give <target> <balance> - Give a player money"
    - "&e/%alias% take <target> <balance> - Take money from a player"
    - "&7&m----------------------------------------------------"
  sotw:
    - "&7&m----------------------------------------------------"
    - "%primary%&lSOTW %secondary%Help"
    - "&7&m----------------------------------------------------"
    - "&e/sotw pause - Pause/Unpause SOTW"
    - "&e/sotw cancel - Cancel SOTW"
    - "&e/sotw start <time> - Start SOTW"
    - "&e/sotw add <seconds> - Add or remove SOTW time"
    - "&e/sotw enable - Enable your SOTW combat status"
    - "&7&m----------------------------------------------------"

timers:
  sotw:
    extended:
      - "&7&m---------------------------"
      - "&9SOTW has been extended!"
      - "&7&m---------------------------"
    shortened:
      - "&7&m---------------------------"
      - "&9SOTW has been shortened!"
      - "&7&m---------------------------"
    paused:
      - "&7&m---------------------------"
      - "&9SOTW has been paused!"
      - "&7&m---------------------------"
    resumed:
      - "&7&m---------------------------"
      - "&9SOTW has been resumed!"
      - "&7&m---------------------------"
    cancel:
      - "&7&m---------------------------"
      - "&9SOTW has been cancelled!"
      - "&7&m---------------------------"
    start:
      - "&7&m---------------------------"
      - "&9SOTW has begun!"
      - "&7&m---------------------------"

factions:
  list:
    header:
      - "&7&m---------------------------"
      - "&eFactions &7(Page %page%/%pages%)"
    entry: "&e%number%. %color%%faction% &7(&a%online%/%max%&7)"
    footer:
      - "&7&m---------------------------"
  help:
    main:
      - "&7&m----------------------------------------------------"
      - "%primary%&l%server-name% &7- %secondary%Faction Help"
      - "&7&m----------------------------------------------------"
      - "&9General Commands:"
      - "&e/%alias% create <name> &7- Create a new faction"
      - "&e/%alias% join <name> &7- Accept a pending invitation"
      - "&e/%alias% lives &7- Show lives usage"
      - "&e/%alias% home &7- Teleport to your faction home"
      - "&e/%alias% stuck &7- Teleport out of enemy territory"
      - "&e/%alias% deposit <amount;all> &7- Deposit money into your faction"
      - "&e/%alias% leave &7- Leave your current team"
      - "&e/%alias% subclaim &7- Show the subclaim help page"
      - "&e/%alias% promote <player> &7- Promote a faction member"
      - "&e/%alias% demote <player> &7- Demote a faction member"
      - " "
      - "&9Information Commands:"
      - "&e/%alias% show [faction;player] &7- Show faction information"
      - "&e/%alias% list &7- Show a list of online factions"
      - "&e/%alias% map &7- Show nearby claims"
      - " "
      - "&9Captains Commands:"
      - "&e/%alias% invite <player> &7- Invite a player to the faction"
      - "&e/%alias% uninvite <player> &7- Revoke an invitation"
      - "&e/%alias% kick <player> &7- Kick a player from the faction"
      - "&e/%alias% invites &7- Show all invitations"
      - "&e/%alias% claim &7- Start a claim for your faction"
      - "&e/%alias% sethome &7- Set your faction's home"
      - "&e/%alias% withdraw <amount;all> &7- Withdraw money from the faction"
      - " "
      - "&9Coleader Commands:"
      - "&e/%alias% captain &7- Show captain management commands"
      - "&e/%alias% unclaim &7- Remove the faction's claim"
      - "&e/%alias% announcement [message] &7- Set the faction's announcement"
      - " "
      - "&9Leader Commands:"
      - "&e/%alias% coleader &7- Show officer management commands"
      - "&e/%alias% revive <player> &7- Revive a teammate using faction lives"
      - "&e/%alias% rename <name> &7- Rename your faction"
      - "&e/%alias% disband &7- Disband your faction"
      - "&7&m----------------------------------------------------"
    captain:
      - "&7&m----------------------------------------------------"
      - "%primary%&lCaptain %secondary%Help"
      - "&7&m----------------------------------------------------"
      - "&e/f captain add <player> &7- Add a captain to the Faction"
      - "&e/f captain remove <player> &7- Remove a captain to the Faction"
      - "&e/f captain list &7- List all of the captains in the Faction"
      - "&7&m----------------------------------------------------"
    coleader:
      - "&7&m----------------------------------------------------"
      - "%primary%&lColeader %secondary%Help"
      - "&7&m----------------------------------------------------"
      - "&e/f coleader add <player> &7- Add a coleader to the Faction"
      - "&e/f coleader remove <player> &7- Remove a coleader to the Faction"
      - "&e/f coleader list &7- List all of the coleaders in the Faction"
      - "&7&m----------------------------------------------------"
  show:
    player:
      - "&7&m---------------------------"
      - "&9%faction% &7[%online-members%&7/%total-members%&7] &3- &eHQ: &f%hq%"
      - "&eLeader: &9%leader%"
      - "&eColeaders: &9%coleaders%"
      - "&eCaptains: &9%captains%"
      - "&eMembers: &9%members%"
      - "&eBalance: &9%balance%"
      - "&ePoints: &9%points%"
      - "&eKOTH Captures: &9%koth-captures%"
      - "&eDeaths until Raidable: &a%dtr%"
      - "&eTime until Regeneration: &b%regeneration-time%" # Member + Staff Only
      - "&eStatus: &9%open%"
      - "&eLives: &c%lives%" # Member + Staff Only
      - "&eAnnouncement: &d%announcement%" # Member + Staff Only
      - "&7&m---------------------------"
    system:
      - "&7&m---------------------------"
      - "%faction%"
      - "&9Location&7: &e%hq%"
      - "&7&m---------------------------"
