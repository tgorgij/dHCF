name: dHCF
version: 1.0
author: Thomas Gorgij
description: A HCF plugin for the modern day
main: me.Thomas.HCF.Main.Main
api-version: 26.2
commands:
  lives:
    description: Manage player lives.
    usage: /lives <set|add|take> <target> <amount>
  revive:
    description: Revive a deathbanned player.
    usage: /revive <player>
  sotw:
  faction:
    aliases:
      - f
      - team
      - t
  balance:
    aliases:
      - bal
      - money
  economy:
    aliases:
      - eco
