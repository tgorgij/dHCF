name: dHCF
version: 1.0
author: Thomas Gorgij
description: A HCF plugin for the modern day
main: me.Thomas.HCF.Main.Main
api-version: 26.2
commands:
  ability:
    description: Give ability items to an online player.
    usage: /ability <player> <item> [amount]
  socialspy:
    aliases: [ss]
    description: Toggle viewing private messages between other players.
    usage: /socialspy
  setend:
    description: Set End portal arrival and return locations.
    usage: /setend <entrance|exit>
  reclaim:
    description: Redeem your rank rewards or reset all reclaims.
    usage: /reclaim [reset]
  dtc:
    description: Configure and run Destroy the Core.
    usage: /dtc <setcore|clearcore|sethealth|start|cancel> [health]
  customtimer:
    description: Create or cancel session-only user and server timers.
    usage: /customtimer <create|cancel> <server|user> [arguments]
  rewards:
    description: Open your faction tech tree.
    usage: /rewards [<faction> list]
  schedule:
    description: Manage daily event schedules.
    usage: /schedule <add|list|remove>
  request:
    aliases: [helpop]
    description: Request help from online staff.
    usage: /request <message>
  report:
    description: Report an online player to staff.
    usage: /report <player> <reason>
  coords:
    description: Show server coordinates.
    usage: /coords
  crowbar:
    description: Give a player a crowbar for harvesting spawners.
    usage: /crowbar <player> <uses>
  spawner:
    description: Give a player typed spawners.
    usage: /spawner <player> <spawner> <amount>
  settings:
    description: Open your player settings.
    usage: /settings
  conquest:
    description: Configure and manage the server's Conquest.
    usage: /conquest <start|cancel|setinterval|setpos1|setpos2>
  bottle:
    description: Store all your experience in a throwable bottle.
    usage: /bottle
  craft:
    description: Open a portable crafting table.
    usage: /craft
  message:
    aliases: [msg, w]
    description: Send a private message to an online player.
    usage: /message <player> <message>
  reply:
    aliases: [r]
    description: Reply to your last private conversation.
    usage: /reply <message>
  mountain:
    description: Create and configure regenerating mountains.
    usage: /mountain <name> <create|delete|reset|setinterval|setblock|setpos1|setpos2>
  staff:
    aliases: [h]
    description: Toggle mod mode or its world interaction bypass.
    usage: /staff [bypass]
  freeze:
    description: Freeze or unfreeze a player or the server.
    usage: /freeze <player|all>
  tphere:
    description: Teleport an online player to you.
    usage: /tphere <player>
  invsee:
    description: Inspect an online player's inventory.
    usage: /invsee <player>
  vanish:
    aliases: [v]
    description: Toggle vanish.
    usage: /vanish
  koth:
    description: Create and manage King of the Hill events.
    usage: /koth <name> <subcommand> [arguments]
  chat:
    description: Pause, clear, or slow public chat.
    usage: /chat <pause|clear|slow> [seconds]
  pay:
    description: Send money to another player.
    usage: /pay <player> <amount>
  logout:
    description: Safely disconnect after a countdown.
    usage: /logout
  pvp:
    description: Manage PvP protection.
    usage: /pvp <enable|give> [player]
  lives:
    description: Check or manage player lives.
    usage: /lives <check|set|add|take> [target] [amount]
  revive:
    description: Revive a deathbanned player.
    usage: /revive <player>
  restore:
    description: Restore an online player's last death inventory and experience.
    usage: /restore <player>
  sotw:
  faction:
    aliases:
      - f
      - team
      - t
  balance:
    aliases:
      - bal
      - money
  economy:
    aliases:
      - eco
permissions:
  hcf.command.socialspy:
    default: op
  hcf.command.setend:
    default: op
  hcf.command.reclaim.reset:
    default: op
  hcf.reclaim.diamond:
    default: false
  hcf.reclaim.gold:
    default: false
  hcf.reclaim.default:
    default: true
  hcf.command.dtc:
    default: op
  hcf.command.customtimer:
    default: op
  hcf.command.rewards.list:
    default: op
  hcf.command.faction.seteventcaptures:
    default: op
  hcf.command.faction.setpoints:
    default: op
  hcf.command.faction.setkills:
    default: op
  hcf.command.faction.forcejoin:
    default: op
  hcf.command.faction.forcepromote:
    default: op
  hcf.command.faction.forcedemote:
    default: op
  hcf.command.faction.forcetransfer:
    default: op
  hcf.command.faction.forcekick:
    default: op
  hcf.command.faction.forceinvite:
    default: op
  hcf.command.faction.setlives:
    default: op
  hcf.command.faction.forcerename:
    default: op
  hcf.command.schedule:
    default: op
  hcf.request.receive:
    default: op
  hcf.report.receive:
    default: op
  hcf.sign.shop.create:
    default: op
  hcf.command.crowbar:
    default: op
  hcf.command.spawner:
    default: op
  hcf.command.conquest:
    default: op
  hcf.command.bottle:
    default: false
  hcf.command.craft:
    default: false
  hcf.donator:
    default: false
  hcf.command.mountain:
    default: op
  hcf.command.staff:
    default: op
  hcf.command.freeze:
    default: op
  hcf.command.tphere:
    default: op
  hcf.command.invsee:
    default: op
  hcf.command.vanish:
    default: op
  hcf.command.invsee.modify:
    default: false
  hcf.freeze.bypass:
    default: false
  hcf.vanish.see:
    default: false
  hcf.potions.bypass:
    description: Allows drinking potions restricted by the map kit.
    default: false
  hcf.command.koth:
    description: Allows managing KOTH events.
    default: op
  hcf.command.chat:
    description: Allows pausing, clearing, and slowing public chat.
    default: op
  hcf.chat.bypass:
    description: Bypasses public chat pauses, slow mode, and clearing.
    default: false
  hcf.mapkit.bypass:
    description: Allows enchanting and combining items above the map kit limits.
    default: false
  hcf.command.pvp:
    description: Allows giving players PvP protection.
    default: op
